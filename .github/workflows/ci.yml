name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

# Cancel in-progress runs for the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Stop Expo from hitting the network for telemetry / updates checks.
  EXPO_OFFLINE: '1'
  EXPO_NO_TELEMETRY: '1'
  CI: 'true'

jobs:
  verify:
    name: typecheck + test + web bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node22-

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci --legacy-peer-deps

      - name: TypeScript check
        run: npm run typecheck

      - name: Unit tests
        run: npm test -- --ci --reporters=default

      - name: Web bundle (expo export)
        run: npx expo export --platform web --output-dir ./web-build

      - name: Upload web bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build-${{ github.sha }}
          path: ./web-build
          retention-days: 7
          if-no-files-found: error

  lint:
    name: prettier check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node22-

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci --legacy-peer-deps

      # Prettier check is non-blocking: there is no enforced config yet. Once
      # `.prettierrc` lands, drop the `continue-on-error`.
      - name: Prettier check (non-blocking)
        continue-on-error: true
        run: npx --yes prettier@3 --check "src/**/*.{ts,tsx}" "scripts/**/*.ts"
